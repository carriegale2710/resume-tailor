name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install docx export dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pandoc gawk
      - name: Set up template folders
        run: |
          [ -d master ] || cp -r master-example master
          [ -d applications ] || cp -r applications-example applications
      - name: Run all tests
        run: bash tests/run-all.sh
